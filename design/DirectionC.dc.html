<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F2EFE8; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; color: #141414; -webkit-font-smoothing: antialiased; word-break: keep-all; }
    a { color: #141414; text-decoration: none; }
    a:hover { color: #B3261E; }
  </style>
</helmet>
<div style="width: 390px; min-height: 760px; background: #F2EFE8; display: flex; flex-direction: column; padding: 0 0 24px;">

  <div style="margin: 18px 20px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; border-top: 3px double #141414; border-bottom: 1px solid #141414; padding: 10px 0 8px;">
    <span style="font-family: 'Gowun Batang', serif; font-size: 34px; font-weight: 700; letter-spacing: 0.3em; margin-right: -0.3em;">돈표</span>
    <span style="font-size: 10.5px; letter-spacing: 0.2em; color: #4B4B4B;">돈 계산 사전 · 2026년 1월 요율</span>
  </div>

  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 11.5px; font-weight: 700; color: #B3261E; letter-spacing: 0.1em;">연봉 실수령액</div>
    <div style="font-family: 'Gowun Batang', serif; font-size: 27px; line-height: 1.3; font-weight: 700;">연봉 4,200만원, 매달 3,041,200원</div>
    <div style="font-size: 13px; line-height: 1.6; color: #4B4B4B;">세전 350만원에서 4대보험과 세금 458,800원을 뗀 금액이다. 부양가족 1인 기준.</div>
  </div>

  <div style="margin: 18px 20px 0; border-top: 1.5px solid #141414; border-bottom: 1.5px solid #141414;">
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 7px 0; font-size: 11px; color: #4B4B4B; border-bottom: 1px solid #141414;"><span>항목</span><span style="text-align: right;">요율</span><span style="text-align: right;">금액</span></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 7px 0; font-size: 13px; border-bottom: 1px solid #C9C5BB;"><span>국민연금</span><span style="text-align: right;">4.75%</span><span style="text-align: right;">166,250</span></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 7px 0; font-size: 13px; border-bottom: 1px solid #C9C5BB;"><span>건강보험</span><span style="text-align: right;">3.595%</span><span style="text-align: right;">125,830</span></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 7px 0; font-size: 13px; border-bottom: 1px solid #C9C5BB;"><span>장기요양</span><span style="text-align: right;">13.14%</span><span style="text-align: right;">16,530</span></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 7px 0; font-size: 13px; border-bottom: 1px solid #C9C5BB;"><span>고용보험</span><span style="text-align: right;">0.9%</span><span style="text-align: right;">31,500</span></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 7px 0; font-size: 13px; border-bottom: 1px solid #C9C5BB;"><span>소득세</span><span style="text-align: right;">간이세액</span><span style="text-align: right;">107,900</span></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 7px 0; font-size: 13px;"><span>지방소득세</span><span style="text-align: right;">10%</span><span style="text-align: right;">10,790</span></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 8px 0; font-size: 13px; font-weight: 700; border-top: 1px solid #141414;"><span>합계</span><span></span><span style="text-align: right; color: #B3261E;">458,800</span></div>
  </div>

  <div style="margin: 18px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="height: 70px; border: 1px solid #C9C5BB;"></div>
    <div style="height: 70px; border: 1px solid #C9C5BB;"></div>
  </div>

  <div style="margin: 24px 20px 0; padding: 14px 16px; background: #FFF7D6; border-radius: 10px; font-size: 12.5px; line-height: 1.6; color: #6B5300;">방향 C — 경제 신문면. 활자·괘선·촘촘한 표로 권위 있는 인상. 정보량은 많지만 모바일에서 답답할 수 있음.</div>

</div>
</x-dc>
</body>
</html>
